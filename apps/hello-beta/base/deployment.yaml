apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-beta
  labels:
    app.kubernetes.io/name: hello-beta
    backstage.io/kubernetes-id: hello-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-beta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-beta
        backstage.io/kubernetes-id: hello-beta
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              value: hello-beta
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
